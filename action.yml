name: "Open Source Project Security Baseline Scanner"
description: "Run Open Source Project Security Baseline assessments on your GitHub repository"
author: "Revanite"

branding:
  icon: "shield"
  color: "blue"

inputs:
  owner:
    description: "Repository owner (organization or user)"
    required: true
  repo:
    description: "Repository name"
    required: true
  token:
    description: "GitHub Personal Access Token with repo read permissions"
    required: true
  catalog:
    description: "OSPS catalog to assess against"
    required: false
    default: "osps-baseline"
  maturity-levels:
    description: "Policy applicability: one maturity level per line (e.g. Maturity Level 1). Default is Level 1 only; add Level 2 / 3 lines to evaluate more controls."
    required: false
    default: |
      Maturity Level 1
  output-format:
    description: "Output format (yaml, json, or sarif)"
    required: false
    default: "yaml"
  upload-sarif:
    description: "Upload results as SARIF to GitHub Security tab. When true, output-format is automatically set to sarif"
    required: false
    default: "false"
  fail-on-error:
    description: "Fail the workflow if any controls have errors. When false, results are reported but the step always passes"
    required: false
    default: "false"

outputs:
  results-path:
    description: "Path to the evaluation results directory"
    value: "evaluation_results"

runs:
  using: "composite"
  steps:
    - name: Create config file
      shell: bash
      env:
        OUTPUT_FORMAT: ${{ inputs.output-format }}
        CATALOG: ${{ inputs.catalog }}
        OWNER: ${{ inputs.owner }}
        REPO: ${{ inputs.repo }}
        TOKEN: ${{ inputs.token }}
        UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        MATURITY_LEVELS: ${{ inputs.maturity-levels }}
      run: |
        # If upload-sarif is enabled, use sarif output format
        if [ "$UPLOAD_SARIF" = "true" ]; then
          FINAL_OUTPUT_FORMAT="sarif"
        else
          FINAL_OUTPUT_FORMAT="$OUTPUT_FORMAT"
        fi

        cat > /tmp/pvtr-config.yml << EOF
        loglevel: "info"
        write-directory: evaluation_results
        write: true
        output: "$FINAL_OUTPUT_FORMAT"
        services:
          pvtr:
            plugin: github-repo
            policy:
              catalogs:
                - "$CATALOG"
              applicability:
        EOF
        MATURITY_COUNT=0
        while IFS= read -r line || [ -n "$line" ]; do
          line="${line#"${line%%[![:space:]]*}"}"
          line="${line%"${line##*[![:space:]]}"}"
          [ -z "$line" ] && continue
          MATURITY_COUNT=$((MATURITY_COUNT + 1))
          printf '                - "%s"\n' "$line" >> /tmp/pvtr-config.yml
        done << MATURITY_EOF
        $MATURITY_LEVELS
        MATURITY_EOF
        if [ "$MATURITY_COUNT" -eq 0 ]; then
          printf '                - "%s"\n' "Maturity Level 1" >> /tmp/pvtr-config.yml
        fi
        cat >> /tmp/pvtr-config.yml << EOF
            vars:
              owner: "$OWNER"
              repo: "$REPO"
              token: "$TOKEN"
        EOF

    - name: Prepare writable results directory
      shell: bash
      run: |
        mkdir -p evaluation_results
        chmod 777 evaluation_results

    - name: Run OSPS Assessment
      shell: bash
      run: |
        docker run --rm \
          -v /tmp/pvtr-config.yml:/.privateer/config.yml \
          -v ${{ github.workspace }}/evaluation_results:/.privateer/bin/evaluation_results \
          ghcr.io/ossf/pvtr-github-repo-scanner:v0.22.0@sha256:fbaa44aeb27e5eb8c66ebf6944b04db08e5a9c860e7be32abee0f0585dd713aa

    - name: Write results to workflow summary
      shell: bash
      env:
        OWNER: ${{ inputs.owner }}
        REPO: ${{ inputs.repo }}
        CATALOG: ${{ inputs.catalog }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: |
        LOG_FILE=$(find evaluation_results -name "*.log" -type f 2>/dev/null | head -1)
        if [ -z "$LOG_FILE" ] || [ ! -f "$LOG_FILE" ]; then
          echo "No log file found, skipping workflow summary"
          exit 0
        fi

        # Parse control results from the log first to determine if we have data
        # Format: TIMESTAMP [LEVEL]  OSPS-XX-YY.ZZ: description
        CONTROL_LINES=$(grep -E '\[INFO\].*OSPS-|\[WARN\].*OSPS-|\[ERROR\].*OSPS-' "$LOG_FILE" || true)

        if [ -z "$CONTROL_LINES" ]; then
          {
            echo "## OSPS Baseline Assessment Results"
            echo ""
            echo "**Repository:** \`${OWNER}/${REPO}\` | **Catalog:** \`${CATALOG}\`"
            echo ""
            echo "No control results found in log output. Please re-run the workflow."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # Extract the summary line (e.g. "pvtr_osps-baseline: 16 Passed, 0 Warnings, 0 Failed, 40 Possible")
        SUMMARY_LINE=$(grep '> pvtr_' "$LOG_FILE" | sed 's/.*> //' || true)

        # Parse counts from the summary line
        PASSED=$(echo "$SUMMARY_LINE" | sed -n 's/.*\([0-9][0-9]*\) Passed.*/\1/p' | head -1)
        WARNINGS=$(echo "$SUMMARY_LINE" | sed -n 's/.*\([0-9][0-9]*\) Warnings.*/\1/p' | head -1)
        FAILED=$(echo "$SUMMARY_LINE" | sed -n 's/.*\([0-9][0-9]*\) Failed.*/\1/p' | head -1)
        POSSIBLE=$(echo "$SUMMARY_LINE" | sed -n 's/.*\([0-9][0-9]*\) Possible.*/\1/p' | head -1)
        PASSED=${PASSED:-0}
        WARNINGS=${WARNINGS:-0}
        FAILED=${FAILED:-0}
        POSSIBLE=${POSSIBLE:-0}
        case "$PASSED" in ''|*[!0-9]*) PASSED=0 ;; esac
        case "$WARNINGS" in ''|*[!0-9]*) WARNINGS=0 ;; esac
        case "$FAILED" in ''|*[!0-9]*) FAILED=0 ;; esac
        case "$POSSIBLE" in ''|*[!0-9]*) POSSIBLE=0 ;; esac

        # Write markdown header and results
        {
          echo "## OSPS Baseline Assessment Results"
          echo ""
          echo "**Repository:** \`${OWNER}/${REPO}\` | **Catalog:** \`${CATALOG}\`"
          echo ""
          echo "| Passed | Warnings | Failed | Possible |"
          echo "|:------:|:--------:|:------:|:--------:|"
          echo "| ${PASSED} | ${WARNINGS} | ${FAILED} | ${POSSIBLE} |"
          echo ""
          echo "_**Possible** is the count of controls not evaluated as pass/fail for the maturity levels in this run (for example Level 1 only). It does not mean those controls passed._"
          echo ""
          echo "### Control Results"
          echo ""
          echo "| Status | Control | Finding |"
          echo "|:------:|---------|---------|"
        } >> "$GITHUB_STEP_SUMMARY"

        echo "$CONTROL_LINES" | while IFS= read -r line; do
          # Determine status icon from log level
          if echo "$line" | grep -q '\[ERROR\]'; then
            ICON=":x:"
          elif echo "$line" | grep -q '\[WARN\]'; then
            ICON=":warning:"
          else
            ICON=":white_check_mark:"
          fi

          # Extract control ID and description
          CONTROL=$(echo "$line" | sed -n 's/.*\(OSPS-[A-Z]*-[0-9]*\.[0-9]*\).*/\1/p')
          DESCRIPTION=$(echo "$line" | sed "s/.*${CONTROL}: //")

          if [ -n "$CONTROL" ]; then
            echo "| ${ICON} | ${CONTROL} | ${DESCRIPTION} |" >> "$GITHUB_STEP_SUMMARY"
          fi
        done

        # Fail the step if there are failed controls and fail-on-error is enabled
        if [ "$FAIL_ON_ERROR" = "true" ] && [ "$FAILED" -gt 0 ]; then
          echo "::error::OSPS Baseline assessment found ${FAILED} failed control(s)"
          exit 1
        fi

    - name: Prepare SARIF file for upload
      shell: bash
      id: sarif
      if: inputs.upload-sarif == 'true'
      continue-on-error: true
      run: |
        SARIF_FILE=$(find evaluation_results -name "*.sarif" -type f 2>/dev/null | head -1)
        if [ -n "$SARIF_FILE" ] && [ -f "$SARIF_FILE" ]; then
          # Code Scanning shows tool.driver.name; Privateer sets it to the plugin id ("github-repo").
          NATIVE_COUNT=$(jq -r '[.runs[]?.results[]?] | length' "$SARIF_FILE" 2>/dev/null || true)
          case "$NATIVE_COUNT" in ''|*[!0-9]*) NATIVE_COUNT=0 ;; esac
          if [ "$NATIVE_COUNT" -eq 0 ]; then
            echo "::notice::Scanner SARIF has 0 result entries (common when a tool only emits findings, not passes). Use this job summary and evaluation_results artifacts for Passed / Warnings / Failed / Possible. If the log shows failures but SARIF stays empty, file an issue at https://github.com/ossf/pvtr-github-repo-scanner/issues"
          fi
          # GitHub Code Scanning rejects uploads with zero results; add a neutral placeholder only when the file is otherwise empty.
          jq '.runs |= map(
            .tool.driver.name = "OSPS Baseline"
            | if ((.results // []) | length) == 0 then
                .tool.driver.rules = ((.tool.driver.rules // []) + [{
                  "id": "OSPS-BASELINE/SARIF-UPLOAD-PLACEHOLDER",
                  "name": "SarifUploadPlaceholder",
                  "shortDescription": {"text": "No SARIF findings in scanner output"},
                  "fullDescription": {"text": "The scanner produced no SARIF result objects. That usually means no issues were encoded into SARIF for this run—not that every OSPS control passed. Check the workflow summary and evaluation_results (log/yaml/json) for full status. Possible counts reflect controls outside the selected maturity levels. This note exists only because GitHub requires at least one SARIF result to accept an upload."},
                  "defaultConfiguration": {"level": "note"}
                }])
                | .results = [{
                  "ruleId": "OSPS-BASELINE/SARIF-UPLOAD-PLACEHOLDER",
                  "kind": "informational",
                  "level": "note",
                  "message": {"text": "No SARIF findings from the scanner in this file. See the workflow summary and evaluation_results for Passed, Warnings, Failed, and Possible counts."},
                  "locations": [{
                    "physicalLocation": {
                      "artifactLocation": {"uri": "README.md"}
                    }
                  }]
                }]
              else . end
          )' "$SARIF_FILE" > "${SARIF_FILE}.tmp" \
            && mv "${SARIF_FILE}.tmp" "$SARIF_FILE" || rm -f "${SARIF_FILE}.tmp"
          # Validate that the SARIF file contains at least one result
          # GitHub Code Scanning requires at least one result in runs[].results array
          RESULT_COUNT=$(jq -r '[.runs[]?.results[]?] | length' "$SARIF_FILE" 2>/dev/null || true)
          case "$RESULT_COUNT" in
            ''|*[!0-9]*) RESULT_COUNT=0 ;;
          esac
          if [ "$RESULT_COUNT" -gt 0 ]; then
            echo "✅ SARIF file contains $RESULT_COUNT result(s)"
            echo "sarif_file=$SARIF_FILE" >> $GITHUB_OUTPUT
            echo "has_results=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  SARIF file exists but contains no results. GitHub Code Scanning requires at least one result."
            echo "sarif_file=" >> $GITHUB_OUTPUT
            echo "has_results=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "⚠️  No SARIF file found in evaluation_results directory"
          echo "sarif_file=" >> $GITHUB_OUTPUT
          echo "has_results=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload SARIF to GitHub Security tab
      if: inputs.upload-sarif == 'true' && steps.sarif.outputs.sarif_file != '' && steps.sarif.outputs.has_results == 'true'
      uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc # v4.34.1
      with:
        sarif_file: ${{ steps.sarif.outputs.sarif_file }}
        wait-for-processing: true
      continue-on-error: true

    - name: Cleanup temporary config file
      shell: bash
      if: always()
      run: |
        if [ -f /tmp/pvtr-config.yml ]; then
          rm -f /tmp/pvtr-config.yml
        fi
