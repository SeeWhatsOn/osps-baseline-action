name: "Open Source Project Security Baseline Scanner"
description: "Run Open Source Project Security Baseline assessments on your GitHub repository"
author: "Revanite"

branding:
  icon: "shield"
  color: "blue"

inputs:
  owner:
    description: "Repository owner (organization or user)"
    required: true
  repo:
    description: "Repository name"
    required: true
  token:
    description: "GitHub Personal Access Token with repo read permissions"
    required: true
  catalog:
    description: "OSPS catalog to assess against"
    required: false
    default: "osps-baseline"
  output-format:
    description: "Output format (yaml, json, or sarif)"
    required: false
    default: "yaml"
  upload-sarif:
    description: "Upload results as SARIF to GitHub Security tab. When true, output-format is automatically set to sarif"
    required: false
    default: "false"
  fail-on-error:
    description: "Fail the workflow if any controls have errors. When false, results are reported but the step always passes"
    required: false
    default: "false"
  scanner-image:
    description: "Container image for pvtr-github-repo-scanner (used when scanner-build-from-source is false). Must match a tag published to GHCR or any image your runner can pull"
    required: false
    default: "ghcr.io/ossf/pvtr-github-repo-scanner:v0.22.1"
  scanner-build-from-source:
    description: "If true, clone ossf/pvtr-github-repo-scanner and docker build instead of pulling scanner-image (useful to test a Git tag/branch/SHA that has no GHCR manifest)"
    required: false
    default: "false"
  scanner-source-repository:
    description: "Git URL to clone when scanner-build-from-source is true (forks can point here)"
    required: false
    default: "https://github.com/ossf/pvtr-github-repo-scanner.git"
  scanner-source-ref:
    description: "Git ref to build when scanner-build-from-source is true (branch name, tag, or commit SHA)"
    required: false
    default: "main"

outputs:
  results-path:
    description: "Path to the evaluation results directory"
    value: "evaluation_results"

runs:
  using: "composite"
  steps:
    - name: Create config file
      shell: bash
      env:
        OUTPUT_FORMAT: ${{ inputs.output-format }}
        CATALOG: ${{ inputs.catalog }}
        OWNER: ${{ inputs.owner }}
        REPO: ${{ inputs.repo }}
        TOKEN: ${{ inputs.token }}
        UPLOAD_SARIF: ${{ inputs.upload-sarif }}
      run: |
        # If upload-sarif is enabled, use sarif output format
        if [ "$UPLOAD_SARIF" = "true" ]; then
          FINAL_OUTPUT_FORMAT="sarif"
        else
          FINAL_OUTPUT_FORMAT="$OUTPUT_FORMAT"
        fi

        cat > /tmp/pvtr-config.yml << EOF
        loglevel: "info"
        write-directory: evaluation_results
        write: true
        output: "$FINAL_OUTPUT_FORMAT"
        services:
          pvtr:
            plugin: github-repo
            policy:
              catalogs:
                - "$CATALOG"
              applicability:
                - "Maturity Level 1"
            vars:
              owner: "$OWNER"
              repo: "$REPO"
              token: "$TOKEN"
        EOF

    - name: Prepare writable results directory
      shell: bash
      run: |
        mkdir -p evaluation_results
        chmod 777 evaluation_results

    - name: Build scanner image from source
      if: inputs.scanner-build-from-source == 'true'
      shell: bash
      env:
        SCANNER_SOURCE_REPOSITORY: ${{ inputs.scanner-source-repository }}
        SCANNER_SOURCE_REF: ${{ inputs.scanner-source-ref }}
      run: |
        set -euo pipefail
        DEST="${RUNNER_TEMP}/pvtr-github-repo-scanner-build"
        rm -rf "$DEST"
        git clone --no-checkout --filter=blob:none "$SCANNER_SOURCE_REPOSITORY" "$DEST"
        cd "$DEST"
        git fetch --depth 1 origin "$SCANNER_SOURCE_REF"
        git checkout FETCH_HEAD
        docker build -t pvtr-github-repo-scanner:local .

    - name: Run OSPS Assessment
      shell: bash
      env:
        SCANNER_IMAGE: ${{ inputs.scanner-build-from-source == 'true' && 'pvtr-github-repo-scanner:local' || inputs.scanner-image }}
      run: |
        docker run --rm \
          -v /tmp/pvtr-config.yml:/.privateer/config.yml \
          -v ${{ github.workspace }}/evaluation_results:/.privateer/bin/evaluation_results \
          "$SCANNER_IMAGE"

    - name: Write results to workflow summary
      shell: bash
      env:
        OWNER: ${{ inputs.owner }}
        REPO: ${{ inputs.repo }}
        CATALOG: ${{ inputs.catalog }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: |
        set -euo pipefail
        OSPS_ID='OSPS-[A-Z0-9]+-[0-9]+\.[0-9]+'

        latest_file() {
          find evaluation_results -name "$1" -type f 2>/dev/null | while read -r f; do
            [ -f "$f" ] || continue
            m=$(stat -c '%Y' "$f" 2>/dev/null || stat -f '%m' "$f" 2>/dev/null || echo 0)
            printf '%s\t%s\n' "$m" "$f"
          done | sort -n | tail -1 | cut -f2-
        }

        LOG_FILE=$(latest_file '*.log')
        SARIF_FILE=$(latest_file '*.sarif')

        if [ -z "$LOG_FILE" ] || [ ! -f "$LOG_FILE" ]; then
          echo "No log file found, skipping workflow summary"
          exit 0
        fi

        # Legacy format: TIMESTAMP [LEVEL]  OSPS-...
        CONTROL_LINES=$(grep -Ei '\[(info|warn|warning|error|fatal)\].*'"$OSPS_ID" "$LOG_FILE" || true)
        # Newer pvtr / structured logs: any line containing a control id (avoid depending on bracketed levels)
        if [ -z "$CONTROL_LINES" ]; then
          CONTROL_LINES=$(grep -E "$OSPS_ID" "$LOG_FILE" || true)
        fi

        SUMMARY_FROM=""
        PASSED=0
        WARNINGS=0
        FAILED=0

        if [ -n "$CONTROL_LINES" ]; then
          SUMMARY_FROM=log
          SUMMARY_LINE=$(grep -Ei '> pvtr_' "$LOG_FILE" | sed 's/.*> //' || true)
          PASSED=$(echo "$SUMMARY_LINE" | sed -n 's/.*\([0-9][0-9]*\) Passed.*/\1/p')
          WARNINGS=$(echo "$SUMMARY_LINE" | sed -n 's/.*\([0-9][0-9]*\) Warnings.*/\1/p')
          FAILED=$(echo "$SUMMARY_LINE" | sed -n 's/.*\([0-9][0-9]*\) Failed.*/\1/p')
          PASSED=${PASSED:-0}
          WARNINGS=${WARNINGS:-0}
          FAILED=${FAILED:-0}
        elif [ -n "${SARIF_FILE:-}" ] && [ -f "$SARIF_FILE" ] && command -v jq >/dev/null 2>&1; then
          RC=$(jq '[.runs[]?.results[]?] | length' "$SARIF_FILE" 2>/dev/null || echo 0)
          if [ "$RC" -gt 0 ]; then
            SUMMARY_FROM=sarif
            FAILED=$(jq '[.runs[]?.results[]? | select(.level == "error")] | length' "$SARIF_FILE" 2>/dev/null || echo 0)
            WARNINGS=$(jq '[.runs[]?.results[]? | select(.level == "warning")] | length' "$SARIF_FILE" 2>/dev/null || echo 0)
            PASSED=$(jq '[.runs[]?.results[]? | select(.level != "error" and .level != "warning")] | length' "$SARIF_FILE" 2>/dev/null || echo 0)
          fi
        fi

        if [ -z "$SUMMARY_FROM" ]; then
          {
            echo "## OSPS Baseline Assessment Results"
            echo ""
            echo "**Repository:** \`${OWNER}/${REPO}\` | **Catalog:** \`${CATALOG}\`"
            echo ""
            echo "No control results could be parsed from the log (pvtr log format may have changed). If a SARIF file was written, check \`evaluation_results\` or the Security tab."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        {
          echo "## OSPS Baseline Assessment Results"
          echo ""
          echo "**Repository:** \`${OWNER}/${REPO}\` | **Catalog:** \`${CATALOG}\`"
          echo ""
          echo "| Passed | Warnings | Failed |"
          echo "|:------:|:--------:|:------:|"
          echo "| ${PASSED} | ${WARNINGS} | ${FAILED} |"
          echo ""
          echo "### Control Results"
          echo ""
          echo "| Status | Control | Finding |"
          echo "|:------:|---------|---------|"
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$SUMMARY_FROM" = log ]; then
          echo "$CONTROL_LINES" | while IFS= read -r line; do
            [ -z "$line" ] && continue
            if echo "$line" | grep -qiE '\[(error|fatal)\]|level=(error|fatal)|"level"[[:space:]]*:[[:space:]]*"error"'; then
              ICON=":x:"
            elif echo "$line" | grep -qiE '\[(warn|warning)\]|level=warning|"level"[[:space:]]*:[[:space:]]*"warning"'; then
              ICON=":warning:"
            else
              ICON=":white_check_mark:"
            fi
            CONTROL=$(echo "$line" | grep -oE "$OSPS_ID" | head -1 || true)
            if [ -z "$CONTROL" ]; then
              continue
            fi
            DESCRIPTION=$(echo "$line" | sed "s/^.*${CONTROL}: //" | sed 's/|/\\|/g')
            if [ "$DESCRIPTION" = "$line" ]; then
              DESCRIPTION=$(echo "$line" | sed "s/^.*${CONTROL}[[:space:]]*//" | sed 's/|/\\|/g')
            fi
            echo "| ${ICON} | ${CONTROL} | ${DESCRIPTION} |" >> "$GITHUB_STEP_SUMMARY"
          done
        else
          jq -r '.runs[]?.results[]? |
            [
              (.level // "note"),
              (.ruleId // .rule.id // "?"),
              ((.message | if type == "object" then (.text // .markdown // "") else . end) // "")
            ] | @tsv' "$SARIF_FILE" | while IFS="$(printf '\t')" read -r level ruleId msg; do
            [ -z "$ruleId" ] && continue
            [ "$ruleId" = "?" ] && continue
            case "$level" in
              error) ICON=":x:" ;;
              warning) ICON=":warning:" ;;
              *) ICON=":white_check_mark:" ;;
            esac
            msg=${msg//$'\t'/ }
            msg=$(printf '%s' "$msg" | sed 's/|/\\|/g')
            echo "| ${ICON} | ${ruleId} | ${msg} |" >> "$GITHUB_STEP_SUMMARY"
          done
        fi

        if [ "$FAIL_ON_ERROR" = "true" ] && [ "$FAILED" -gt 0 ]; then
          echo "::error::OSPS Baseline assessment found ${FAILED} failed control(s)"
          exit 1
        fi

    - name: Prepare SARIF file for upload
      shell: bash
      id: sarif
      if: inputs.upload-sarif == 'true'
      continue-on-error: true
      run: |
        SARIF_FILE=$(find evaluation_results -name "*.sarif" -type f 2>/dev/null | head -1)
        if [ -n "$SARIF_FILE" ] && [ -f "$SARIF_FILE" ]; then
          # Validate that the SARIF file contains at least one result
          # GitHub Code Scanning requires at least one result in runs[].results array
          RESULT_COUNT=$(jq '[.runs[]?.results[]?] | length' "$SARIF_FILE" 2>/dev/null || echo "0")
          if [ "$RESULT_COUNT" -gt 0 ]; then
            echo "✅ SARIF file contains $RESULT_COUNT result(s)"
            echo "sarif_file=$SARIF_FILE" >> $GITHUB_OUTPUT
            echo "has_results=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  SARIF file exists but contains no results. GitHub Code Scanning requires at least one result."
            echo "sarif_file=" >> $GITHUB_OUTPUT
            echo "has_results=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "⚠️  No SARIF file found in evaluation_results directory"
          echo "sarif_file=" >> $GITHUB_OUTPUT
          echo "has_results=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload SARIF to GitHub Security tab
      if: inputs.upload-sarif == 'true' && steps.sarif.outputs.sarif_file != '' && steps.sarif.outputs.has_results == 'true'
      uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
      with:
        sarif_file: ${{ steps.sarif.outputs.sarif_file }}
        wait-for-processing: true
      continue-on-error: true

    - name: Cleanup temporary config file
      shell: bash
      if: always()
      run: |
        if [ -f /tmp/pvtr-config.yml ]; then
          rm -f /tmp/pvtr-config.yml
        fi
